name: rest-in-hackaton
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup_env.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run python3 scripts/setup_env.py}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-project.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  pgdata:
