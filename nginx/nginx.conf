# Clean WebSocket upgrade header mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP Server — Port 80: Automatic 301 redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server — Port 443: Single Entrypoint Reverse Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # SSL / TLS Termination
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header Origin "https://localhost";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Web Client (SPA and static assets)
    location / {
        proxy_pass http://client:80;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Go Backend WebSocket
    location /ws {
        proxy_pass http://server:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Origin "https://localhost";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Go Backend Authentication Endpoints
    location /auth/ {
        proxy_pass http://server:3000/auth/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Go Backend Health Endpoint
    location /health {
        proxy_pass http://server:3000/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Go Backend API Prefix Fallback
    location /api/ {
        proxy_pass http://server:3000/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
